<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SPIC | Student Registration</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family: Arial, sans-serif;

        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(37,99,235,0.35),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(59,130,246,0.25),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #07152f,
                    #102a56,
                    #0b1f3f
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }


        .register-card {

            width: 550px;

            background: white;

            padding: 40px;

            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.35);

        }


        .heading {

            text-align: center;

            margin-bottom: 28px;

        }


        .icon {

            width: 60px;

            height: 60px;

            margin: auto;

            margin-bottom: 15px;

            border-radius: 15px;

            background: #2563eb;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

        }


        .heading h1 {

            color: #172554;

            margin-bottom: 8px;

        }


        .heading p {

            color: #64748b;

            font-size: 14px;

        }


        .error {

            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 9px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 13px;

        }


        .input-group {

            margin-bottom: 17px;

        }


        .form-row {

            display: flex;

            gap: 15px;

        }


        .form-row .input-group {

            flex: 1;

        }


        label {

            display: block;

            color: #334155;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;

        }


        input,
        select {

            width: 100%;

            height: 48px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            padding: 0 13px;

            outline: none;

            background: #f8fafc;

            font-size: 14px;

        }


        input:focus,
        select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37,99,235,0.1);

        }


        .register-button {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

        }


        .register-button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 10px 25px rgba(37,99,235,0.3);

        }


        .login-link {

            text-align: center;

            margin-top: 22px;

            color: #64748b;

            font-size: 14px;

        }


        .login-link a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;

        }


        .login-link a:hover {

            text-decoration: underline;

        }


        @media(max-width:600px) {

            .register-card {

                width: 100%;

                padding: 25px;

            }


            .form-row {

                flex-direction: column;

                gap: 0;

            }

        }

    </style>

</head>


<body>


<div class="register-card">


    <div class="heading">


        <div class="icon">

            <i class="fa-solid fa-user-plus"></i>

        </div>


        <h1>
            Create Student Account
        </h1>


        <p>
            Register to access the SPIC Student Performance System
        </p>


    </div>


    {% if error %}

    <div class="error">

        <i class="fa-solid fa-circle-exclamation"></i>

        {{ error }}

    </div>

    {% endif %}


    <form action="/register" method="POST">


        <!-- NAME -->

        <div class="input-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <!-- ENROLLMENT -->

        <div class="input-group">

            <label>
                Enrollment Number
            </label>

            <input
                type="text"
                name="enrollment"
                placeholder="Example: SPIC004"
                required
            >

        </div>


        <!-- DEPARTMENT -->

        <div class="input-group">

            <label>
                Department
            </label>

            <select name="department" required>

                <option value="">
                    Select Department
                </option>

                <option>
                    Computer Science Engineering
                </option>

                <option>
                    Artificial Intelligence
                </option>

                <option>
                    Information Technology
                </option>

                <option>
                    Electronics and Communication Engineering
                </option>

                <option>
                    Electrical Engineering
                </option>

                <option>
                    Mechanical Engineering
                </option>

            </select>

        </div>


        <!-- YEAR + SEMESTER -->

        <div class="form-row">


            <div class="input-group">

                <label>
                    Year
                </label>

                <select name="year" required>

                    <option value="">
                        Select Year
                    </option>

                    <option>
                        1st Year
                    </option>

                    <option>
                        2nd Year
                    </option>

                    <option>
                        3rd Year
                    </option>

                    <option>
                        4th Year
                    </option>

                </select>

            </div>


            <div class="input-group">

                <label>
                    Semester
                </label>

                <select name="semester" required>

                    <option value="">
                        Select Semester
                    </option>

                    <option>
                        1st Semester
                    </option>

                    <option>
                        2nd Semester
                    </option>

                    <option>
                        3rd Semester
                    </option>

                    <option>
                        4th Semester
                    </option>

                    <option>
                        5th Semester
                    </option>

                    <option>
                        6th Semester
                    </option>

                    <option>
                        7th Semester
                    </option>

                    <option>
                        8th Semester
                    </option>

                </select>

            </div>


        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="input-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >

        </div>


        <!-- BUTTON -->

        <button
            type="submit"
            class="register-button">

            <i class="fa-solid fa-user-plus"></i>

            Create Account

        </button>


    </form>


    <div class="login-link">

        Already have an account?

        <a href="/">
            Sign In
        </a>

    </div>


</div>


</body>

</html>
